name: candlescope-server-phase1ag

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:49092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
    ports:
      - "49092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: candlescope
      POSTGRES_USER: candlescope
      POSTGRES_PASSWORD: phase1ag-local-only
    ports:
      - "27432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candlescope -d candlescope"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.17.56
    environment:
      CLICKHOUSE_DB: candlescope
      CLICKHOUSE_USER: candlescope
      CLICKHOUSE_PASSWORD: phase1ag-local-only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "48123:8123"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client --user candlescope --password phase1ag-local-only
          --query 'SELECT 1'
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: candlescope
      MINIO_ROOT_PASSWORD: phase1ag-local-secret
    ports:
      - "49000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - minio-data:/data

volumes:
  clickhouse-data:
  minio-data:
  postgres-data:
  redpanda-data:
