name: candlescope-phase1ai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:60092
      - --rpc-addr=redpanda:33146
      - --advertise-rpc-addr=redpanda:33146
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
    ports:
      - "127.0.0.1:60092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 2s
      timeout: 5s
      retries: 30
    logging: *default-logging
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: candlescope
      POSTGRES_USER: candlescope
      POSTGRES_PASSWORD: ${CANDLESCOPE_PHASE1AI_POSTGRES_PASSWORD:?}
    ports:
      - "127.0.0.1:29432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candlescope -d candlescope"]
      interval: 2s
      timeout: 5s
      retries: 30
    logging: *default-logging
    volumes:
      - postgres-data:/var/lib/postgresql

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.17.56
    environment:
      CLICKHOUSE_DB: candlescope
      CLICKHOUSE_USER: candlescope
      CLICKHOUSE_PASSWORD: ${CANDLESCOPE_PHASE1AI_CLICKHOUSE_PASSWORD:?}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:59123:8123"
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --user candlescope --password "$$CLICKHOUSE_PASSWORD" --query 'SELECT 1'
      interval: 2s
      timeout: 5s
      retries: 60
    logging: *default-logging
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CANDLESCOPE_PHASE1AI_MINIO_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${CANDLESCOPE_PHASE1AI_MINIO_SECRET_KEY:?}
    ports:
      - "127.0.0.1:60000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 60
    logging: *default-logging
    volumes:
      - minio-data:/data

volumes:
  clickhouse-data:
  minio-data:
  postgres-data:
  redpanda-data:
