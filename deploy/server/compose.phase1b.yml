name: candlescope-server-phase1b

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: candlescope
      POSTGRES_USER: candlescope
      POSTGRES_PASSWORD: phase1b-local-only
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candlescope -d candlescope"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
  redpanda-data:
