name: candlescope-server-phase1i

services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: candlescope
      POSTGRES_USER: candlescope
      POSTGRES_PASSWORD: phase1i-local-only
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candlescope -d candlescope"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: candlescope
      MINIO_ROOT_PASSWORD: phase1i-local-secret
    ports:
      - "19000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - minio-data:/data

volumes:
  minio-data:
  postgres-data:
